<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>kowl payroll · admin</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root { --ink: #0F1419; --gray: #536471; --line: #EFF3F4; --line-2: #CFD9DE; --blue: #1D9BF0; --red: #F4212E; --green: #00BA7C; --gold: #F5A30F; --peach: #FCE6DB; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: #F7F9F9; }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line-2); padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  header h1 { font-size: 17px; margin: 0 10px 0 0; }
  input, select { font: inherit; border: 1.5px solid var(--line-2); border-radius: 10px; padding: 7px 10px; background: #fff; min-width: 0; }
  input:focus { outline: none; border-color: var(--blue); }
  button { font: inherit; font-weight: 700; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 13px; cursor: pointer; white-space: nowrap; }
  button.ghost { background: #fff; color: var(--ink); }
  button.ok { background: var(--green); border-color: var(--green); }
  button.bad { background: var(--red); border-color: var(--red); }
  button.star { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  main { padding: 16px; max-width: 1240px; margin: 0 auto; }
  #msg { min-height: 1.4em; font-weight: 700; margin: 0 0 10px; }
  #msg.err { color: var(--red); } #msg.ok { color: var(--green); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button { background: #fff; color: var(--ink); border-color: var(--line-2); }
  .tabs button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .tabs b { font-size: 12px; background: rgba(15,20,25,.12); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
  .freeze { margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .freeze.on { color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1.5px solid var(--line-2); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .media { background: var(--peach); aspect-ratio: 1; display: grid; place-items: center; }
  .media img, .media video { width: 100%; height: 100%; object-fit: contain; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .meta { font-size: 12.5px; color: var(--gray); word-break: break-all; }
  .st { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 6px; padding: 2px 7px; background: var(--line); text-transform: uppercase; letter-spacing: .04em; }
  .flags { margin: 0; padding-left: 18px; font-size: 13px; color: #8a1720; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .acts input { flex: 1 1 120px; padding: 5px 9px; font-size: 13.5px; }
  .acts input.pts { flex: 0 0 70px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1.5px solid var(--line-2); border-radius: 14px; overflow: hidden; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { background: #F7F9F9; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); }
  td.num { font-family: ui-monospace, Consolas, monospace; text-align: right; }
  tr.banned td { background: #fde8ea; }
  .empty { text-align: center; color: var(--gray); padding: 40px; }
  a { color: var(--blue); }
</style>
</head>
<body>
<header>
  <h1>kowl payroll · admin</h1>
  <input id="api" placeholder="API base, e.g. https://kowl-payroll.up.railway.app" size="36" autocomplete="off">
  <input id="token" type="password" placeholder="ADMIN_TOKEN" size="20" autocomplete="off">
  <button id="load">load</button>
  <button class="ghost" id="forget">forget token</button>
</header>
<main>
  <p id="msg"></p>
  <div class="tabs" id="tabs">
    <button class="on" data-t="memes">memes</button>
    <button data-t="bagwork">bagwork</button>
    <button data-t="x_links">X links</button>
    <button data-t="withdrawals">withdrawals</button>
    <button data-t="reports">reports</button>
    <button data-t="accounts">accounts</button>
    <label class="freeze" id="freezeBox"><input type="checkbox" id="freeze"> freeze all withdrawal sends</label>
  </div>
  <div id="view"><p class="empty">paste the API base and the token, then load.</p></div>
</main>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const api = $("#api"), token = $("#token"), msg = $("#msg");
  api.value = localStorage.getItem("kowl-admin-api") || "";
  token.value = sessionStorage.getItem("kowl-admin-token") || "";
  let q = { memes: [], bagwork: [], x_links: [], withdrawals: [], reports: [], frozen: false }, accounts = [], tab = "memes";

  const base = () => api.value.trim().replace(/\/+$/, "");
  const say = (t, kind) => { msg.textContent = t || ""; msg.className = kind || ""; };
  const ago = (t) => { const s = (Date.now() - Date.parse(t)) / 1000; return !isFinite(s) ? "" : s < 3600 ? Math.round(s / 60) + "m ago" : s < 86400 ? Math.round(s / 3600) + "h ago" : Math.round(s / 86400) + "d ago"; };
  const sol = (v) => (Number(v) || 0).toFixed(4);
  const isSig = (s) => /^[1-9A-HJ-NP-Za-km-z]{43,100}$/.test(s || "");
  const isAddr = (s) => /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(s || "");
  const xUrl = (u) => /^https?:\/\/(www\.|mobile\.)?(x|twitter)\.com\//i.test(u || "") ? u : "";
  const handle = (h) => String(h || "").replace(/[^A-Za-z0-9_]/g, "").slice(0, 15);
  async function call(path, body) {
    const res = await fetch(base() + path, {
      method: body ? "POST" : "GET",
      headers: Object.assign({ Authorization: "Bearer " + token.value.trim() }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch { /* not json */ }
    if (!res.ok || (data && data.ok === false)) throw new Error((data && data.error) || "HTTP " + res.status);
    return data;
  }
  // admin media (/api/admin/media/…) needs the Bearer header, so it's fetched and shown as a blob url; the token never goes in a URL
  const blobCache = new Map();
  function media(m) {
    if (!m || !m.url) return "no media";
    let u = "";
    // only ever send the admin token to the API's own origin
    try { const abs = new URL(m.url, base() + "/"); if (abs.origin === new URL(base()).origin) u = abs.href; } catch { /* bad url */ }
    if (!u) return "no media";
    return `<span class="lazy-media" data-src="${esc(u)}" data-kind="${m.kind === "video" ? "video" : "image"}">loading…</span>`;
  }
  async function hydrateMedia() {
    for (const el of document.querySelectorAll(".lazy-media")) {
      const src = el.dataset.src;
      try {
        let url = blobCache.get(src);
        if (!url) {
          const res = await fetch(src, { headers: { Authorization: "Bearer " + token.value.trim() } });
          if (!res.ok) throw new Error(res.status);
          url = URL.createObjectURL(await res.blob());
          blobCache.set(src, url);
        }
        el.outerHTML = el.dataset.kind === "video" ? `<video src="${url}" controls muted playsinline preload="metadata"></video>` : `<img src="${url}" alt="">`;
      } catch (e) { el.textContent = "media didn't load (" + e.message + ")"; }
    }
  }
  const reported = () => (q.reports && q.reports.length ? q.reports
    : (q.memes || []).filter((m) => m.reports && m.reports.length).map((m) => ({ meme: m, meme_id: m.id, reasons: m.reports, count: m.reports.length })));
  const who = (x) => `${esc(x.name || x.account_name || "kowl")}${x.account_id != null ? ` · acct ${esc(x.account_id)}` : ""}${x.email ? ` · ${esc(x.email)}` : ""}`;
  const reasonBox = '<input placeholder="reason" data-reason>';

  const views = {
    memes: () => cards(q.memes, (m) => `
      <div class="media">${media(m)}</div>
      <div class="body">
        <div><span class="st">${esc(m.status)}</span> ${m.best ? '<span class="st" style="background:var(--gold)">⭐ best</span>' : ""}</div>
        <b>${esc(m.title || "untitled")}</b>
        <span class="meta">#${esc(m.id)} · ${who(m.author || m)} · ${esc(ago(m.created_at))}</span>
        ${flags(m)}
        <div class="acts" data-id="${esc(m.id)}">
          ${m.status !== "approved" ? '<button class="ok" data-a="meme-approve">approve</button>' : ""}
          <button class="star" data-a="meme-best">${m.best ? "remove ⭐" : "⭐ best (+30)"}</button>
          ${reasonBox}<button class="bad" data-a="meme-reject">${m.status === "approved" ? "take down" : "reject"}</button>
        </div>
      </div>`, "no memes waiting. kowl is proud of you."),
    reports: () => cards(reported(), (r) => {
      const m = r.meme || q.memes.find((x) => String(x.id) === String(r.meme_id)) || r;
      return `<div class="media">${media(m)}</div>
      <div class="body">
        <b>${esc(m.title || "meme #" + (r.meme_id || m.id))}</b>
        <span class="meta">meme #${esc(r.meme_id || m.id)} · ${esc(r.count || (r.reasons && r.reasons.length) || 1)} report(s)</span>
        <ul class="flags">${(r.reasons || [r]).map((x) => `<li>${esc(x.reason)} ${esc(x.ts ? ago(x.ts) : "")}</li>`).join("")}</ul>
        <div class="acts" data-id="${esc(r.meme_id || m.id)}">${reasonBox}<button class="bad" data-a="meme-reject">take down</button><button class="ok" data-a="meme-approve">keep it</button></div>
      </div>`;
    }, "no reports."),
    bagwork: () => cards(q.bagwork, (b) => `
      <div class="body">
        <div><span class="st">${esc(b.status)}</span></div>
        <b>${xUrl(b.url) ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">open the post on X ↗</a>` : esc(b.url)}</b>
        <span class="meta">#${esc(b.id)} · ${who(b)} · linked X: @${esc(handle(b.x_handle))} · ${esc(ago(b.created_at))}</span>
        ${b.note ? `<span class="meta">note: ${esc(b.note)}</span>` : ""}
        <span class="meta">check: it's @${esc(handle(b.x_handle))}'s post · it starts with "paid by $KOWL" · the Paid Partnership label is on.</span>
        <div class="acts" data-id="${esc(b.id)}">
          <input class="pts" type="number" min="0" max="20" value="10" data-points> <button class="ok" data-a="bag-approve">approve</button>
          ${reasonBox}<button class="bad" data-a="bag-reject">reject</button>
        </div>
      </div>`, "no bagwork waiting."),
    x_links: () => cards(q.x_links, (x) => `
      <div class="body">
        <b><a href="https://x.com/${esc(handle(x.x_handle))}" target="_blank" rel="noopener">@${esc(handle(x.x_handle))} ↗</a></b>
        <span class="meta">${who(x)} · requested ${esc(ago(x.requested_at || x.created_at))}</span>
        <span class="meta">the bio must contain: <b style="color:var(--ink);font-size:15px">${esc(x.code || x.x_code)}</b></span>
        <div class="acts" data-id="${esc(x.account_id != null ? x.account_id : x.id)}">
          <button class="ok" data-a="x-approve">approve</button>${reasonBox}<button class="bad" data-a="x-reject">reject</button>
        </div>
      </div>`, "no X links waiting."),
    withdrawals: () => cards(q.withdrawals, (w) => `
      <div class="body">
        <div><span class="st">${esc(w.status)}</span></div>
        <b>${esc(sol(w.amount_sol != null ? w.amount_sol : w.sol))} SOL</b>
        <span class="meta">#${esc(w.id)} · ${who(w)} · ${esc(ago(w.created_at || w.ts))}</span>
        <span class="meta">to ${isAddr(w.address) ? `<a href="https://solscan.io/account/${esc(w.address)}" target="_blank" rel="noopener">${esc(w.address)}</a>` : esc(w.address)}</span>
        ${isSig(w.sig) ? `<span class="meta"><a href="https://solscan.io/tx/${esc(w.sig)}" target="_blank" rel="noopener">tx ↗</a></span>` : ""}
        ${w.review_reason ? `<span class="meta">why it's here: ${esc(w.review_reason)}</span>` : ""}
        <div class="acts" data-id="${esc(w.id)}">
          <button class="ok" data-a="wd-approve">approve</button>${reasonBox}<button class="bad" data-a="wd-reject">reject (refund)</button>
        </div>
      </div>`, "no withdrawals waiting for review."),
    accounts: () => accounts.length ? `<table><thead><tr><th>account</th><th>email</th><th>X</th><th>balance</th><th>earned</th><th>withdrawn</th><th>pts (24h)</th><th>actions</th></tr></thead><tbody>${
      accounts.map((a) => `<tr class="${a.banned ? "banned" : ""}"><td>${esc(a.name)}<div class="meta">#${esc(a.id)} · joined ${esc(ago(a.joined_at))}</div></td><td>${esc(a.email)}</td>
        <td>${a.x_handle ? `@${esc(handle(a.x_handle))} <span class="st">${esc(a.x_status)}</span>` : "–"}</td>
        <td class="num">${sol(a.balance_sol)}</td><td class="num">${sol(a.earned_total_sol)}</td><td class="num">${sol(a.withdrawn_total_sol)}</td><td class="num">${esc(a.points_round)}</td>
        <td><div class="acts" data-id="${esc(a.id)}"><input class="pts" type="number" value="0" data-points><input placeholder="reason" data-reason><button class="ghost" data-a="points">adjust pts</button>
          ${a.banned ? '<button class="ok" data-a="unban">unban</button>' : '<button class="bad" data-a="ban">ban (freezes balance)</button>'}</div></td></tr>`).join("")
    }</tbody></table>` : '<p class="empty">no accounts yet.</p>',
  };
  function flags(m) {
    const f = (m.flags || []).map((x) => `<li>flag: ${esc(x.kind)} ${esc(x.detail || "")}</li>`).join("");
    const r = (m.reports || []).map((x) => `<li>report: ${esc(x.reason)}</li>`).join("");
    return f || r ? `<ul class="flags">${f}${r}</ul>` : "";
  }
  function cards(list, tpl, empty) {
    return list && list.length ? `<div class="grid">${list.map((x) => `<article class="card">${tpl(x)}</article>`).join("")}</div>` : `<p class="empty">${empty}</p>`;
  }
  function render() {
    document.querySelectorAll("#tabs button[data-t]").forEach((b) => {
      const n = b.dataset.t === "accounts" ? accounts.length : b.dataset.t === "reports" ? reported().length : (q[b.dataset.t] || []).length;
      b.innerHTML = `${esc(b.dataset.t.replace("_", " "))}<b>${n}</b>`;
      b.classList.toggle("on", b.dataset.t === tab);
    });
    $("#freeze").checked = !!q.frozen;
    $("#freezeBox").classList.toggle("on", !!q.frozen);
    $("#view").innerHTML = views[tab]();
    hydrateMedia();
  }
  async function load() {
    if (!base() || !token.value.trim()) { say("need the API base and the token.", "err"); return; }
    localStorage.setItem("kowl-admin-api", base());
    sessionStorage.setItem("kowl-admin-token", token.value.trim());
    say("loading…");
    try {
      const [qq, aa] = await Promise.all([call("/api/admin/queue"), call("/api/admin/accounts")]);
      q = Object.assign({ memes: [], bagwork: [], x_links: [], withdrawals: [], reports: [], frozen: false }, qq || {});
      accounts = Array.isArray(aa) ? aa : (aa && aa.accounts) || [];
      say(`loaded · ${q.memes.length} memes, ${q.bagwork.length} bagwork, ${q.x_links.length} X links, ${q.withdrawals.length} withdrawals, ${q.reports.length} reports`, "ok");
      render();
    } catch (e) { say(e.message, "err"); }
  }
  const ACTIONS = {
    "meme-approve": (id) => ["/api/admin/memes/approve", { meme_id: id }],
    "meme-reject": (id, r) => ["/api/admin/memes/reject", { meme_id: id, reason: r }, true],
    "meme-best": (id) => ["/api/admin/memes/best", { meme_id: id, best: !(q.memes.find((m) => String(m.id) === String(id)) || {}).best }],
    "bag-approve": (id, r, p) => ["/api/admin/bagwork/approve", { id, points: p }],
    "bag-reject": (id, r) => ["/api/admin/bagwork/reject", { id, reason: r }, true],
    "x-approve": (id) => ["/api/admin/x/approve", { account_id: id }],
    "x-reject": (id, r) => ["/api/admin/x/reject", { account_id: id, reason: r }, true],
    "wd-approve": (id) => ["/api/admin/withdrawals/approve", { id }],
    "wd-reject": (id, r) => ["/api/admin/withdrawals/reject", { id, reason: r }, true],
    points: (id, r, p) => ["/api/admin/points", { account_id: id, points: p, reason: r }, true],
    ban: (id, r) => ["/api/admin/ban", { account_id: id, reason: r }, true],
    unban: (id) => ["/api/admin/unban", { account_id: id }],
  };
  $("#view").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-a]");
    if (!b) return;
    const box = b.closest(".acts"), raw = box.dataset.id, id = isNaN(+raw) ? raw : +raw;
    const reason = ($("[data-reason]", box) || {}).value || "";
    const points = Number(($("[data-points]", box) || {}).value || 0);
    const [path, body, needsReason] = ACTIONS[b.dataset.a](id, reason.trim(), points);
    if (needsReason && !reason.trim()) { say("that needs a reason (the kowl sees it).", "err"); return; }
    if (b.dataset.a === "bag-approve" && !(points >= 0 && points <= 20)) { say("bagwork points are 0-20.", "err"); return; }
    if (b.dataset.a === "ban" && !confirm("ban account " + raw + "? their balance freezes.")) return;
    b.disabled = true;
    try { await call(path, body); say(`${b.dataset.a} #${raw}: done.`, "ok"); await load(); }
    catch (err) { say(err.message, "err"); b.disabled = false; }
  });
  $("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-t]"); if (b) { tab = b.dataset.t; render(); } });
  $("#freeze").addEventListener("change", async (e) => {
    const on = e.target.checked;
    if (on && !confirm("pause ALL withdrawal sends?")) { e.target.checked = false; return; }
    try { await call("/api/admin/freeze", { frozen: on }); q.frozen = on; say(on ? "withdrawal sends paused." : "withdrawal sends resumed.", "ok"); render(); }
    catch (err) { e.target.checked = !on; say(err.message, "err"); }
  });
  $("#load").addEventListener("click", load);
  $("#forget").addEventListener("click", () => { sessionStorage.removeItem("kowl-admin-token"); token.value = ""; say("token forgotten."); });
  if (api.value && token.value) load();
})();
</script>
</body>
</html>
